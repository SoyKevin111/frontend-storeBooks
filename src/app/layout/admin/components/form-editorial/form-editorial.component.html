<div class="fixed inset-0 bg-black bg-opacity-60 z-40 flex items-center justify-center">
  <div [ngClass]="animationState" class="w-full max-w-md bg-white rounded-xl shadow-lg mx-4 md:mx-0">

    <!-- Título -->
    <h1 class="py-8 text-center font-bold text-2xl text-gray-800">EDITORIAL FORM</h1>

    <form class="px-8 pb-8 space-y-6">
      <!-- Name -->
      <div>
        <label for="name" class="block mb-2 text-sm font-medium text-gray-900">Name</label>
        <input type="text" id="name" name="name"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter editorial name" required />
      </div>

      <!-- Phone -->
      <div>
        <label for="phone" class="block mb-2 text-sm font-medium text-gray-900">Phone</label>
        <input type="text" id="phone" name="phone"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter phone number" required />
      </div>

      <!-- Website -->
      <div>
        <label for="website" class="block mb-2 text-sm font-medium text-gray-900">Website</label>
        <input type="url" id="website" name="website"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          placeholder="https://example.com" required />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email</label>
        <input type="email" id="email" name="email"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter email address" required />
      </div>

      <!-- State -->
      <div>
        <label for="state" class="block mb-2 text-sm font-medium text-gray-900">State</label>
        <input type="text" id="state" name="state"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter state" required />
      </div>

      <!-- Botones -->
      <div class="flex justify-around pt-4">
        <button type="button"
        (click)="close()"
          class="text-white bg-red-500 hover:bg-red-700 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm w-full sm:w-auto px-6 py-2.5 text-center">
          Cancel
        </button>
        <button type="submit"
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-6 py-2.5 text-center">
          Save
        </button>
      </div>
    </form>
  </div>
</div>
