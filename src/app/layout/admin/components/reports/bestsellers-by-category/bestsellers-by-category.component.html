<details class="group bg-white rounded-xl shadow border border-gray-200 overflow-hidden">
	<summary class="cursor-pointer px-6 py-4 text-lg font-bold bg-green-100 border-b border-green-200">
		🏆 Best Sellers by Category
	</summary>
	<div class="p-6 space-y-8">
		<div class="flex justify-end">
			<button (click)="exportToPDF()"
				class="bg-green-600 hover:bg-green-700 text-white text-sm font-medium py-2 px-4 rounded shadow">
				Export to PDF
			</button>
		</div>

		@for (category of groupedData | keyvalue; track category.key) {
		<h3 class="text-base font-semibold text-green-700 mb-2">{{category.key}}</h3>
		<app-reports-table [columns]="columns" [data]="category.value">
		</app-reports-table>
		}
	</div>
</details>
