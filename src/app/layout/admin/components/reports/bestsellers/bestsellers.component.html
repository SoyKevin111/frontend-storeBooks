<details class="group bg-white rounded-xl shadow border border-gray-200 overflow-hidden">
	<summary class="cursor-pointer px-6 py-4 text-lg font-bold bg-red-100 border-b border-red-200">
		🔥 Best Sellers
	</summary>
	<div class="p-6 space-y-4">
		<div class="flex justify-end">
			<button (click)="exportToPDF()"
				class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-2 px-4 rounded shadow">
				Export to PDF
			</button>
		</div>
		<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
			@for (book of data$; track book.title) {
			<div class="flex items-start rounded shadow px-4 py-3 border-l-8 bg-white"
				[ngClass]="color.getBorderColor(book.title)">
				<div class="w-full">
					<span class="inline-block text-xs font-semibold px-2 py-1 rounded mb-1"
						[ngStyle]="color.getCategoryStyle(book.category)">
						{{ book.category }}
					</span>
					<p class="text-sm text-gray-800 w-full truncate">
						<span [ngStyle]="{ color: color.getEmojiColor(book.title) }">📕</span>
						{{ book.title }}<br>
						<span class="font-semibold">{{ book.sales }} sales</span>
					</p>
				</div>
			</div>

			}
		</div>
	</div>
</details>
