<details class="group bg-white rounded-xl shadow border border-gray-200 overflow-hidden">
	<summary class="cursor-pointer px-6 py-4 text-lg font-bold bg-blue-100 border-b border-blue-200">
		📈 Monthly Sales
	</summary>
	<div class="p-6 space-y-4">

		<div class="flex justify-end">
			<button (click)="exportToPDF()"
				class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded shadow">
				Export to PDF
			</button>
		</div>
		<div>
			<app-reports-table [columns]="columns" [data]="data$" [maxHeight]="'300px'"></app-reports-table>
		</div>
	</div>
</details>
