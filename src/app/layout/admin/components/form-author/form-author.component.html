<div class="fixed inset-0 bg-black bg-opacity-60 z-40 flex items-center justify-center">
  <div [ngClass]="animationState" class="w-full max-w-md bg-white rounded-xl shadow-lg mx-4 md:mx-0">
    
    <!-- Título -->
    <h1 class="py-8 text-center font-bold text-2xl text-gray-800">AUTHOR FORM</h1>

    <form class="px-8 pb-8 space-y-6">
      <!-- First Name -->
      <div>
        <label for="first_name" class="block mb-2 text-sm font-medium text-gray-900">First Name</label>
        <input type="text" id="first_name" name="first_name"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter first name" required />
      </div>

      <!-- Last Name -->
      <div>
        <label for="last_name" class="block mb-2 text-sm font-medium text-gray-900">Last Name</label>
        <input type="text" id="last_name" name="last_name"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter last name" required />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email</label>
        <input type="email" id="email" name="email"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter email address" required />
      </div>

      <!-- State -->
      <div>
        <label for="state" class="block mb-2 text-sm font-medium text-gray-900">State</label>
        <input type="text" id="state" name="state"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter state" required />
      </div>

      <!-- Botones -->
      <app-cancel-save-buttons
        (closeModal)="close()"
        [functionTyeRec]="functionTyeEm"
      ></app-cancel-save-buttons>
    </form>
  </div>
</div>
