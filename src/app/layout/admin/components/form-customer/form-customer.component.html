<div class="fixed inset-0 bg-black bg-opacity-60 z-40 flex items-center justify-center">
  <div [ngClass]="animationState" class="w-[500px] bg-white rounded-xl shadow-lg mx-4 md:mx-0">
    <!-- Título -->
    <h1 class="py-8 text-center font-bold text-2xl text-gray-800">CUSTOMER FORM</h1>
    <form [formGroup]="createCustomerForm" (ngSubmit)="onSubmit()" class="px-8 pb-8 space-y-6">
      <!-- Row 1: First Name & Last Name -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="name" class="block mb-2 text-sm font-medium text-gray-900">First Name</label>
          <input type="text" id="name" name="name" formControlName="name"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
            placeholder="Enter first name" required />
        </div>
        <div>
          <label for="lastname" class="block mb-2 text-sm font-medium text-gray-900">Last Name</label>
          <input type="text" id="lastname" name="lastname" formControlName="lastName"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
            placeholder="Enter last name" required />
        </div>
      </div>

      <!-- Row 2: Identity Number (full width) -->
      <div>
        <label for="identityNumber" class="block mb-2 text-sm font-medium text-gray-900">Identity Number</label>
        <input type="text" id="identityNumber" name="identityNumber" formControlName="identityNumber"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter identity number" required />
      </div>

      <!-- Row 3: Username & Date of Birth -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="username" class="block mb-2 text-sm font-medium text-gray-900">Username</label>
          <input type="text" id="username" name="username" formControlName="username"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
            placeholder="Enter username" required />
        </div>
        <div>
          <label for="dateOfBirth" class="block mb-2 text-sm font-medium text-gray-900">Date of Birth</label>
          <input type="date" id="dateOfBirth" name="dateOfBirth" formControlName="dateOfBirth"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
            required />
        </div>
      </div>

      <!-- Row 4: Address -->
      <div>
        <label for="address" class="block mb-2 text-sm font-medium text-gray-900">Address</label>
        <input type="text" id="address" name="address" formControlName="address"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter address" required />
      </div>

      <!-- Row 5: Phone & State -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="phone" class="block mb-2 text-sm font-medium text-gray-900">Phone</label>
          <input type="text" id="phone" name="phone" formControlName="phone"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
            placeholder="Enter phone number" required />
        </div>

        <!-- Choose State -->
        <div class="relative">
          <label class="block mb-2 text-sm font-medium text-gray-900">State</label>
          <button type="button" (click)="toggleState = !toggleState"
            class="w-full border border-gray-300 rounded px-4 py-2 text-left bg-white shadow-sm hover:bg-gray-50">
            {{ createCustomerForm.get('state')?.value || 'Choose State' }}
            <span class="float-right">▼</span>
          </button>
          <div [ngClass]="toggleState ? 'block' : 'hidden'"
            class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded shadow-md max-h-60 overflow-y-auto">

            @for (state of stateOptions; track state) {
            <div (click)="selectState(state)" class="px-4 py-2 hover:bg-gray-100 cursor-pointer">
              {{ state }}
            </div>
            }

          </div>
        </div>

      </div>

      <app-cancel-save-buttons (closeModal)="close()" [functionTyeRec]="functionTyeEm"></app-cancel-save-buttons>

    </form>
  </div>
</div>
