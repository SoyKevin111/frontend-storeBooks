<div class="px-6 h-full">
	<h1 class="text-lg font-medium">Books</h1>
	<div class="table-books">
		<app-crud-table
			[columns]="columns"
			[data]="booksWithExtras"
			(create)="createBook()"
			(edit)="editBook($event)"
			(delete)="deleteBook($event)"
			(view)="viewBook($event)">
		</app-crud-table>
	</div>
	<app-pagination></app-pagination>
</div>
