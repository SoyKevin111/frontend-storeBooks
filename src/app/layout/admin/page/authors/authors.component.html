<div class="px-6">
	<h1 class="py-6 text-lg font-medium">Authors</h1>
	<div class="table-books">
		<app-crud-table
			[columns]="columns"
			[data]="authors"
			(create)="createAuthor()"
			(edit)="editAuthor($event)"
			(delete)="deleteAuthor($event)"
			(view)="viewAuthor($event)">
		</app-crud-table>
	</div>
</div>
