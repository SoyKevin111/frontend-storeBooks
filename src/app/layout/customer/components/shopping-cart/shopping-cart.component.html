<!-- Backdrop -->
<div class="fixed inset-0 bg-black bg-opacity-50 z-40 flex items-center justify-center">
  <!-- Modal Container -->
  <div [ngClass]="animationState"
    class="w-full max-w-6xl max-h-[70vh] overflow-hidden rounded-xl bg-gray-50 p-8 shadow-xl border border-gray-200 flex flex-col">

    <!-- Header -->
    <div class="mb-6 flex items-center justify-between">
      <h2 class="text-2xl font-semibold text-gray-900 tracking-tight">🛍️ Shopping Cart</h2>
    </div>

    <!-- Scrollable Table -->
    <div class="flex-1 overflow-y-auto rounded-lg border border-gray-200">
      <table class="w-full table-auto text-sm text-gray-800">
        <thead class="sticky top-0 bg-gray-100 border-b text-gray-600 text-left text-xs uppercase tracking-wider z-10">
          <tr>
            <th class="px-4 py-3">ISBN</th>
            <th class="px-4 py-3">Title</th>
            <th class="px-4 py-3 text-center">Price</th>
            <th class="px-4 py-3 text-center">Quantity</th>
            <th class="px-4 py-3 text-center">Subtotal</th>
            <th class="px-4 py-3 text-center">Remove</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr class="hover:bg-gray-100" *ngFor="let book of [
                { isbn: '978-0132350884', title: 'Clean Code', price: 15, quantity: 2 },
                { isbn: '978-0134494166', title: 'Clean Architecture', price: 18, quantity: 1 },
                { isbn: '978-0321125217', title: 'Domain-Driven Design', price: 25, quantity: 1 },
                { isbn: '978-0201633610', title: 'Design Patterns', price: 30, quantity: 1 },
                { isbn: '978-1491950357', title: 'Site Reliability Engineering', price: 28, quantity: 1 },
                { isbn: '978-1492078005', title: 'Software Engineering at Google', price: 35, quantity: 1 },
                { isbn: '978-0131177055', title: 'Refactoring', price: 22, quantity: 1 },
                { isbn: '978-1617292545', title: 'Spring in Action', price: 27, quantity: 1 },
                { isbn: '978-0596007126', title: 'Head First Design Patterns', price: 24, quantity: 1 },
                { isbn: '978-0131103627', title: 'The C Programming Language', price: 20, quantity: 1 }
              ]">
            <td class="px-4 py-3">{{ book.isbn }}</td>
            <td class="px-4 py-3 font-medium">{{ book.title }}</td>
            <td class="text-center">${{ book.price.toFixed(2) }}</td>
            <td class="text-center">
              <div class="flex items-center justify-center gap-2">
                <button class="rounded-md bg-red-100 hover:bg-red-200 px-2 py-0.5 text-red-600">−</button>
                <span class="font-medium">{{ book.quantity }}</span>
                <button class="rounded-md bg-green-100 hover:bg-green-200 px-2 py-0.5 text-green-600">+</button>
              </div>
            </td>
            <td class="text-center font-semibold">
              ${{ (book.price * book.quantity).toFixed(2) }}
            </td>
            <td class="text-center">
              <button title="Remove" class="rounded-full p-1.5 bg-red-100 hover:bg-red-200 text-red-600 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M6 7h12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7h12z" />
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Totals -->
    <div class="mt-6 space-y-1 text-right text-gray-700">
      <p class="text-sm">Subtotal: <span class="font-semibold">$269.00</span></p>
      <p class="text-sm">iva (15%): <span class="font-semibold">$40.35</span></p>
      <p class="text-lg font-bold text-gray-900">Total: $309.35</p>
    </div>

    <!-- Buttons -->
    <div class="mt-6 flex items-center justify-between">
      <button (click)="close()" class="text-sm text-blue-600 hover:underline">← Continue Shopping</button>
      <div class="flex gap-3">
        <button (click)="close()"
          class="rounded-lg border border-gray-300 bg-white px-5 py-2 text-gray-700 hover:bg-gray-100">
          Cancel
        </button>
        <button class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700 transition">
          Complete Purchase
        </button>
      </div>
    </div>
  </div>
</div>
