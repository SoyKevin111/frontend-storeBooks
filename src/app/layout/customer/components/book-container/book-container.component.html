<!-- Contenedor que se ajusta al alto restante -->
<div class="h-[calc(100vh-144px)] overflow-y-auto px-2">
  <!-- Grid de tarjetas de libros -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 p-4">

    <div *ngFor="let i of [1,2,3,4,5]"
      class="border border-gray-200 rounded-lg bg-white shadow-sm hover:shadow-md transition-all p-3 text-center mb-4">
      <img class="w-full h-80 object-cover rounded"
        ngSrc="/assets/img/portada_generica.webp"
        alt="El señor de los anillos" loading="lazy" width="320" height="400" />

      <p class="mt-3 text-gray-800 font-semibold text-sm">El señor de los anillos</p>

      <div class="flex justify-center mt-2 mb-3 space-x-1">
        <img width="120px" height="120px" src="assets/icon/16231558095-star-rating.svg" alt="Estrellas" />
      </div>

      <div
        class="bg-green-100 border border-green-300 rounded px-4 py-2 inline-flex items-center justify-center mx-auto w-32
    hover:bg-green-400 hover:text-white hover:border-green-500 transition-all duration-300 ease-in-out transform hover:scale-105 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 mr-2">
          <path
            d="M2.25 2.25a.75.75 0 0 0 0 1.5h1.386c.17 0 .318.114.362.278l2.558 9.592a3.752 3.752 0 0 0-2.806 3.63c0 .414.336.75.75.75h15.75a.75.75 0 0 0 0-1.5H5.378A2.25 2.25 0 0 1 7.5 15h11.218a.75.75 0 0 0 .674-.421 60.358 60.358 0 0 0 2.96-7.228.75.75 0 0 0-.525-.965A60.864 60.864 0 0 0 5.68 4.509l-.232-.867A1.875 1.875 0 0 0 3.636 2.25H2.25ZM3.75 20.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM16.5 20.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Z" />
        </svg>

        <span class="font-semibold">150$</span>
      </div>
    </div>


  </div>
</div>
