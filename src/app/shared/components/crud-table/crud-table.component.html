<div class="w-full flex flex-col bg-white text-sm border-b-2 border-gray-200">
  <!-- Header -->
  <div class="flex justify-between items-center mb-4" [style.visibility]="type ? 'hidden' : 'visible'">
    <button (click)="onCreate()"
      class="inline-flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 pr-6 rounded-md transition duration-150 focus:outline-none shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span class="font-semibold">New</span>
    </button>
  </div>

  <!-- Tabla con encabezado fijo y contenido scroll -->
  <div class="overflow-y-auto flex-1">
    <table class="min-w-full table-fixed border-collapse">
      <thead
        class="bg-gray-100 text-gray-700 uppercase text-xs font-semibold sticky top-0 border-b border-gray-200 z-10">
        <tr>
          @for (col of columns; track col) {
          <th class="px-5 py-3 text-left truncate font-extrabold">
            {{ col.header }}
          </th>
          }
          <th class="px-5 font-extrabold py-3 text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (row of data; track row) {
        <tr class="hover:bg-gray-50 border-b border-gray-100">
          @for (col of columns; track col) {
          <td class="px-5 py-3 text-gray-800 truncate max-w-[200px]">
            {{ row[col.field] }}
          </td>
          }
          <td class="px-5 py-3">
            <div class="flex gap-2 justify-center">
              <!-- Ver -->
              <button
                class="w-8 h-8 flex items-center justify-center bg-yellow-500 hover:bg-yellow-600 text-white rounded-md transition"
                (click)="onView(row)" title="View">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>

              @if (type !== 'view') {
              <!-- Editar -->
              <button
                class="w-8 h-8 flex items-center justify-center bg-blue-500 hover:bg-blue-600 text-white rounded-md transition"
                (click)="onEdit(row)" title="Update">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5Z" />
                </svg>
              </button>

              <!-- Eliminar -->
              <button
                class="w-8 h-8 flex items-center justify-center bg-red-500 hover:bg-red-600 text-white rounded-md transition"
                (click)="onDelete(row)" title="Delete">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M6 7h12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7h12z" />
                </svg>
              </button>
              }
            </div>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
