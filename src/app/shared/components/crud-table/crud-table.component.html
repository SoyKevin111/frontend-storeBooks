<div class="w-full h-[650px] flex flex-col bg-white overflow-hidden">
<div class="flex justify-between items-center pb-4">
  <button
    (click)="onCreate()"
    class="inline-flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-5 rounded-md shadow-md transition-all duration-200 focus:outline-none">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
         viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
    </svg>
    
    <span>New</span>
  </button>
</div>


	<!-- Header fijo + body scroll -->
	<div class="overflow-y-auto flex-1">
		<table class="min-w-full table-fixed">
			<thead class="bg-gray-100 text-gray-600 text-sm font-semibold uppercase tracking-wide sticky top-0 z-10">
				<tr>
					@for (col of columns; track col) {
					<th class="px-5 py-3 text-left border-b border-gray-300 bg-gray-100 truncate">
						{{ col.header }}
					</th>
					}
					<th class="px-5 py-3 text-left border-b border-gray-300 bg-gray-100">Actions</th>
				</tr>
			</thead>
			<tbody>
				@for (row of data; track row) {
				<tr class="hover:bg-gray-50 transition duration-150">
					@for (col of columns; track col) {
					<td class="px-5 py-4 text-sm text-gray-800 border-b border-gray-100 truncate max-w-[200px]">
						{{ row[col.field] }}
					</td>
					}
					<td class="px-5 py-4 border-b border-gray-100">
						<div class="flex gap-2">
							<!-- View -->
							<button
								class="w-9 h-9 flex items-center justify-center bg-blue-500 hover:bg-blue-600 text-white rounded-full shadow transition duration-200"
								(click)="onView(row)"
								title="View">
								<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
									stroke="currentColor" stroke-width="2">
									<path stroke-linecap="round" stroke-linejoin="round"
										d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
									<path stroke-linecap="round" stroke-linejoin="round"
										d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
								</svg>
							</button>

							<!-- Edit -->
							<button
								class="w-9 h-9 flex items-center justify-center bg-yellow-400 hover:bg-yellow-500 text-white rounded-full shadow transition duration-200"
								(click)="onEdit(row)"
								title="Edit">
								<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
									stroke="currentColor" stroke-width="2">
									<path stroke-linecap="round" stroke-linejoin="round"
										d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5Z" />
								</svg>
							</button>

							<!-- Delete -->
							<button
								class="w-9 h-9 flex items-center justify-center bg-red-500 hover:bg-red-600 text-white rounded-full shadow transition duration-200"
								(click)="onDelete(row)"
								title="Delete">
								<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
									stroke="currentColor" stroke-width="2">
									<path stroke-linecap="round" stroke-linejoin="round"
										d="M6 7h12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7h12z" />
								</svg>
							</button>
						</div>
					</td>
				</tr>
				}
			</tbody>
		</table>
	</div>
</div>
