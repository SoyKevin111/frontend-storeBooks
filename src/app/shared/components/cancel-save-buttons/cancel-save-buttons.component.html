<div class="flex justify-around mt-7">
	<!-- Botones -->
	<button type="button" (click)="close($event)"
		class="text-white bg-red-500 hover:bg-red-700 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm w-full sm:w-auto px-10 py-2.5 text-center">
		Cancel
	</button>

	@if (functionTyeRec == 'create') {
	<button type="submit"
		class="text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-sm w-full sm:w-auto px-10 py-2.5 text-center">
		Create
	</button>
	}
	@if (functionTyeRec == 'update') {
	<button type="submit"
		class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-10 py-2.5 text-center">
		Update
	</button>
	}
</div>
